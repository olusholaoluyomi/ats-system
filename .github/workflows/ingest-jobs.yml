name: ingest-jobs

on:
  schedule:
    # hourly: the job board's 48h freshness window means "fresh" only means
    # something if a new posting shows up soon after it goes live. this is
    # safe cost-wise - LLM classification only ever runs on genuinely NEW
    # external IDs (see dedupe-and-write.ts), so polling more often doesn't
    # multiply classification spend, just how quickly new postings surface.
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ingest-jobs
  cancel-in-progress: false # queue, don't cancel - a cancelled mid-write run could leave classification half-applied

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # sha-pinned third-party action, matching ci.yml. no version input, it reads packageManager from package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: ingest job board postings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: node scripts/ingest-jobs.mjs
