name: ingest-jobs

on:
  schedule:
    # every 4 hours (6 runs/day), not hourly - Firestore's free tier caps
    # reads/writes at 50k/20k per day, and scripts/ingest-jobs.mjs's own
    # comment has the budget math for why hourly (24 runs/day) doesn't fit
    # once the board covers 150+ companies. 6 runs/day still keeps the
    # board's 48h freshness window meaningfully fresh.
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

concurrency:
  group: ingest-jobs
  cancel-in-progress: false # queue, don't cancel - a cancelled mid-write run could leave a company partially written

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # sha-pinned third-party action, matching ci.yml. no version input, it reads packageManager from package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: ingest job board postings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/ingest-jobs.mjs

      - name: notify users of matching postings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/notify-matches.mjs
