name: ingest-jobs

on:
  schedule:
    # every 8 hours (3 runs/day) - see scripts/ingest-jobs.mjs's QUOTA
    # BUDGET comment: Firestore bills one read per document a query
    # returns, not one read per query call, so each run's cost is
    # `companies × MAX_POSTINGS_PER_COMPANY` reads, not `companies` reads.
    # a 4-hour cadence (6 runs/day) with the old cap of 40 exhausted the
    # entire 50k/day read quota in a SINGLE run (2026-09-05) - 8 hours with
    # the lowered cap of 15 leaves real headroom for page-view reads too.
    - cron: '0 */8 * * *'
  workflow_dispatch: {}

concurrency:
  group: ingest-jobs
  cancel-in-progress: false # queue, don't cancel - a cancelled mid-write run could leave a company partially written

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # sha-pinned third-party action, matching ci.yml. no version input, it reads packageManager from package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: ingest job board postings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/ingest-jobs.mjs

      - name: notify users of matching postings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/notify-matches.mjs
